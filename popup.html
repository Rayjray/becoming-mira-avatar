<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mira (avatar)</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { background: transparent; font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
      body { display: flex; flex-direction: column; align-items: flex-start; width: 100vw; height: 100vh; padding: 0 8px 8px 12px; }

      #drag-handle { position: relative; align-self: stretch; height: 26px; cursor: grab; display: flex; align-items: center; justify-content: center; user-select: none; }
      #drag-handle:active { cursor: grabbing; }
      #drag-handle .grip { width: 36px; height: 4px; border-radius: 2px; background: rgba(0, 0, 0, 0.25); }

      /* Maten volgen het venster dat Webfuse echt geeft, zodat niets wegvalt. */
      #bol { position: relative; flex: none; width: min(140px, calc(100vw - 30px)); aspect-ratio: 1 / 1; border-radius: 50%; overflow: hidden; background: #152B47; cursor: pointer;
             box-shadow: 0 0 0 3px #5B8DEF, 0 0 22px rgba(91, 141, 239, 0.55), 0 8px 24px rgba(0, 0, 0, 0.35); transition: width .25s, height .25s, border-radius .25s; margin: 4px 0 0 4px; }
      body.groot #bol { width: calc(100vw - 30px); height: calc(100vh - 90px); aspect-ratio: auto; border-radius: 18px; }
      #avatar-video { width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .3s; }
      body.bezig #avatar-video { opacity: 1; }
      #bol-inhoud { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #fff; }
      body.bezig #bol-inhoud { display: none; }
      #bol-label { font-size: 11px; font-weight: 700; letter-spacing: .06em; }
      .draai { display: none; width: 22px; height: 22px; border: 3px solid rgba(255,255,255,.3); border-top-color: #fff; border-radius: 50%; animation: draai .9s linear infinite; }
      body.verbinden .draai { display: block; }
      body.verbinden #mic, body.verbinden #bol-label { display: none; }
      @keyframes draai { to { transform: rotate(360deg); } }

      #knoppen { display: none; gap: 6px; margin: 10px 0 0 4px; flex-wrap: wrap; justify-content: flex-start; }
      #knoppen button { background: rgba(21, 43, 71, 0.92); color: #fff; border: 1px solid rgba(255,255,255,.15); font: 600 12px/1 inherit; padding: 6px 12px; border-radius: 999px; cursor: pointer; }
      #knoppen #stop { background: #7F1D1D; }

      #melding { display: none; margin: 6px 0 0; padding: 6px 10px; border-radius: 10px; background: #fff; color: #1f2a44; font-size: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.15); max-width: calc(100vw - 24px); }
      #melding.fout { background: #3B1D1D; color: #FDE2E2; }
    </style>
    <script src="./anam.js"></script>
    <script src="./popup.js"></script>
  </head>
  <body>
    <div id="drag-handle"><div class="grip"></div></div>
    <div id="bol" role="button" tabindex="0" aria-label="Praat met Mira">
      <video id="avatar-video" autoplay playsinline></video>
      <div id="bol-inhoud">
        <span class="draai"></span>
        <svg id="mic" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z" /><path d="M19 10v2a7 7 0 0 1-14 0v-2" /><line x1="12" y1="19" x2="12" y2="22" />
        </svg>
        <span id="bol-label">…</span>
      </div>
    </div>
    <div id="knoppen">
      <button id="groter" type="button">Groter</button>
      <button id="stop" type="button">Stop</button>
    </div>
    <div id="melding" role="status"></div>
  </body>
</html>
